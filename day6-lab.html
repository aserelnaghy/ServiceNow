    // create a function that takes a password and returns a function that validates the password.
    function validatePass(password) {
        try {
            if (password.length < 8) {
                throw new Error("Password must be at least 8 characters long");
            }
        }
        catch (error) {
            alert(error.message);


        }
    }
    const password = prompt("Enter password");
    validatePass(password);

    //TASK3
    // create a function that stores a secret message and returns 2 methods: updateMessage and readMessage.
    function secretMessage(message) {
        let secret = message;
        return {
            updateMessage: function (newMessage) {
                secret = newMessage;
            },
            readMessage: function () {
                return secret;
            }
        }
    }

    const secret = secretMessage("This is a secret message");
    console.log(secret.readMessage()); // This is a secret message
    secret.updateMessage("Updated secret message");
    console.log(secret.readMessage()); // Updated secret message
</script>
